spring.application.name=ecommerce

# Porta da API (pode ser trocada pela variável de ambiente PORT)
server.port=${PORT:8080}

# H2
spring.datasource.url=jdbc:h2:mem:ecommerce
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
# Lê o import.sql em UTF-8 (evita acentos quebrados no Windows com Java 17)
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mantém o JSON do Page<T> com content, totalElements, totalPages, first, last, size e number
spring.data.web.pageable.serialization-mode=direct

# Swagger UI em http://localhost:8080/swagger-ui.html (a raiz http://localhost:8080 também abre o Swagger)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.use-root-path=true

# CORS: origens do frontend (separadas por vírgula)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
